name: Loft
options:
  bundleIdPrefix: com.dhananjay
  deploymentTarget:
    macOS: "14.0"
targets:
  Loft:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Loft
        PRODUCT_BUNDLE_IDENTIFIER: com.dhananjay.loft
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loft
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    postBuildScripts:
      - name: Bundle helper tools
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/tools"
          rsync -a --delete "$SRCROOT/Vendor/tools/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/tools/"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/fonts"
          rsync -a --delete "$SRCROOT/Vendor/fonts/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/fonts/"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licenses"
          rsync -a --delete "$SRCROOT/Vendor/licenses/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licenses/"
        basedOnDependencyAnalysis: false
